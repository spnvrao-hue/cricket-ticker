<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Cricket Ticker Test</title>
<style>
  :root{
    --panel: rgba(10,10,14,.86);
    --panel2: rgba(28,28,34,.92);
    --text: #fff;
    --muted: #d2d2d8;
    --accent: #ffb000;
    --win: #49d17d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
  body{min-height:100vh;overflow:hidden}
  .ticker-wrap{
    position:fixed;
    left:2.5vw; right:2.5vw; bottom:3vh;
    display:flex; flex-direction:column; gap:0;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,.35));
  }
  .topbar{
    display:grid;
    grid-template-columns: 1.25fr .9fr 1.25fr;
    align-items:stretch;
    min-height:72px;
    border-radius:18px 18px 0 0;
    overflow:hidden;
  }
  .team{
    background:var(--panel);
    padding:12px 18px;
    display:flex; align-items:center; gap:12px;
  }
  .team.right{justify-content:flex-end;text-align:right}
  .team-name{font-size:clamp(15px,2.4vw,28px);font-weight:800;letter-spacing:.02em}
  .score{font-size:clamp(24px,4.2vw,46px);font-weight:900;line-height:1}
  .overs{font-size:clamp(14px,2vw,23px);color:var(--muted);font-weight:700}
  .center{
    background:var(--panel2);
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:10px 14px;
    border-left:1px solid rgba(255,255,255,.12);
    border-right:1px solid rgba(255,255,255,.12);
  }
  .result{font-size:clamp(13px,2.1vw,24px);font-weight:900;color:var(--win);text-transform:uppercase;text-align:center}
  .label{font-size:clamp(10px,1.4vw,16px);color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:3px}
  .subbar{
    background:rgba(255,255,255,.96);
    color:#111;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    padding:9px 16px;
    border-radius:0 0 18px 18px;
    font-size:clamp(12px,1.8vw,20px);
    font-weight:700;
  }
  .subbar .right{text-align:right}
  .tag{color:#8b0000;font-weight:900}
  .source{
    position:fixed; right:3vw; top:3vh;
    background:rgba(0,0,0,.45); color:#fff;
    padding:6px 10px; border-radius:999px;
    font-size:12px;
  }
  @media (max-width:700px){
    .topbar{grid-template-columns:1fr .85fr 1fr;min-height:62px}
    .team{padding:10px 12px;gap:8px}
    .subbar{padding:8px 12px}
  }
</style>
</head>
<body>
<div class="source">TEST TICKER</div>

<div class="ticker-wrap">
  <div class="topbar">
    <div class="team">
      <div>
        <div class="team-name" id="teamA">Sandstorm X1</div>
        <div>
          <span class="score" id="scoreA">110/10</span>
          <span class="overs" id="oversA">(14.2)</span>
        </div>
      </div>
    </div>

    <div class="center">
      <div class="label">Result</div>
      <div class="result" id="result">R3 won by 8 wickets</div>
    </div>

    <div class="team right">
      <div>
        <div class="team-name" id="teamB">R3</div>
        <div>
          <span class="score" id="scoreB">115/2</span>
          <span class="overs" id="oversB">(15.3)</span>
        </div>
      </div>
    </div>
  </div>

  <div class="subbar">
    <div><span class="tag">POTM</span> <span id="potm">Shiva Sai Gayam</span></div>
    <div class="right">Bowling: <span id="bowling">3.2-0-25-4</span></div>
  </div>
</div>

<script>
const SCORECARD_URL = "https://cricheroes.in/scorecard/26355092/mega-smash/sandstorm-x1-vs-r3";

// Test data taken from the scorecard screenshot.
// Later, this object can be replaced by live CricHeroes data.
const match = {
  teamA: "Sandstorm X1",
  scoreA: "110/10",
  oversA: "(14.2)",
  teamB: "R3",
  scoreB: "115/2",
  oversB: "(15.3)",
  result: "R3 won by 8 wickets",
  potm: "Shiva Sai Gayam",
  bowling: "3.2-0-25-4"
};

for (const [key, value] of Object.entries(match)) {
  const el = document.getElementById(key);
  if (el) el.textContent = value;
}

// Demo pulse every 8 seconds so you can verify the web overlay is alive.
setInterval(() => {
  const el = document.querySelector(".ticker-wrap");
  el.animate(
    [{ transform: "translateY(0px)" }, { transform: "translateY(-3px)" }, { transform: "translateY(0px)" }],
    { duration: 500, easing: "ease-out" }
  );
}, 8000);
</script>
</body>
</html>
